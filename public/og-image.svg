<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="One8One Studios and BEJO">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
            <stop stop-color="#030108"/>
            <stop offset="0.52" stop-color="#1d1245"/>
            <stop offset="1" stop-color="#302b63"/>
        </linearGradient>
        <linearGradient id="accent" x1="170" y1="120" x2="420" y2="370" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4f8cff"/>
            <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="30" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="110" r="170" fill="#8d7cff" opacity="0.18" filter="url(#glow)"/>
    <circle cx="170" cy="520" r="190" fill="#4f8cff" opacity="0.14" filter="url(#glow)"/>
    <rect x="78" y="86" width="1044" height="458" rx="40" fill="#0a0616" opacity="0.76" stroke="#8d7cff" stroke-opacity="0.24"/>
    <rect x="126" y="142" width="108" height="108" rx="28" fill="url(#accent)"/>
    <text x="180" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">181</text>
    <text x="126" y="310" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#a395ff">ONE8ONE STUDIOS</text>
    <text x="126" y="390" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff">BEJO</text>
    <text x="126" y="450" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#d1cbff">Aaram Se</text>
    <text x="126" y="505" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">File sharing and print workflows for iOS, Android, and Web.</text>
</svg>
